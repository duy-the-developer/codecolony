<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code Colony</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230d1b2a'/%3E%3Crect x='3' y='3' width='4' height='10' fill='%2350a0e0'/%3E%3Crect x='9' y='6' width='4' height='7' fill='%23e0a040'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="map" aria-label="Map">
      <canvas id="canvas"></canvas>
    </main>
    <aside id="queue" aria-label="Build queue">
      <h2>Build queue</h2>
      <p class="muted">No orders yet.</p>
      <h2>Projects</h2>
      <ul id="projects"></ul>
    </aside>
    <!-- Terminal dock: filled by the dock package. -->
    <section id="dock" aria-label="Terminals" hidden></section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
